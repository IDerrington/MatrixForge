[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixforge"
version = "0.1.0"
description = "An interactive learning website about matrix mathematics"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "IDerrington"},
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "myst-nb>=1.0",
    "pydata-sphinx-theme>=0.15",
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
]

[tool.setuptools]
packages = ["matrixforge"]
package-dir = {"" = "src"}
